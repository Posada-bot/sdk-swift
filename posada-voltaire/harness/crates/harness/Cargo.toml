[package]
name = "voltaire-harness"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "voltaire_harness"
path = "src/lib.rs"

[[bin]]
name = "harness"
path = "src/bin/harness.rs"

[[bin]]
name = "verifier"
path = "src/bin/verifier.rs"

[dependencies]
voltaire-core = { path = "../core" }
voltaire-zk = { path = "../zk" }
curve25519-dalek = { version = "4", features = ["rand_core"] }
ark-bn254 = "0.4"
ark-ff = "0.4"
rand = "0.8"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

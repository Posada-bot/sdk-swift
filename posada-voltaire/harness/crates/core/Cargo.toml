[package]
name = "voltaire-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "voltaire_core"
path = "src/lib.rs"

[dependencies]
curve25519-dalek = { version = "4", features = ["rand_core"] }
rand = "0.8"
rand_core = "0.6"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

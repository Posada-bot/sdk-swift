[workspace]
resolver = "2"
members = ["crates/core", "crates/zk", "crates/harness"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Keep dev builds of the falsification harness reasonably fast for the ZK circuits.
[profile.dev.package."*"]
opt-level = 3
